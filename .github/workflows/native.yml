name: Native builds
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml --check
      - run: npm run build:desktop -- --bundles ${{ matrix.bundle }} --ci
      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:native
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: kartube-${{ runner.os }}
          path: |
            apps/native/src-tauri/target/release/bundle/deb/*.deb
            apps/native/src-tauri/target/release/bundle/nsis/*.exe
            /tmp/kartube-native.png
            /tmp/kartube-native-report.json
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - run: npm ci
      - run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          npm run build:android -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: kartube-android-arm64-debug
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
