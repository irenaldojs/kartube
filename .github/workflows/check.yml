name: Checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  websocket-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cargo fmt --manifest-path apps/server/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path apps/server/Cargo.toml
      - run: npm run check:spike
  webgl-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:web
      - uses: actions/upload-artifact@v4
        with:
          name: webgl-smoke
          path: |
            /tmp/kartube-chase.png
            /tmp/kartube-track.png
            /tmp/kartube-webgl.png
            /tmp/kartube-webgl-report.json
